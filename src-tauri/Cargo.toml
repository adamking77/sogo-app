[package]
name = "sogo-desktop"
version = "0.1.0"
description = "Personal Claude Code desktop client"
authors = ["Adam King"]
edition = "2021"

[lib]
name = "sogo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
dotenvy = "0.15"
notify = "6"
block2 = "0.6"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSBezierPath", "NSColor", "NSGraphics", "NSImage", "NSResponder", "NSView", "NSVisualEffectView", "block2"] }
objc2-core-foundation = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["NSGeometry", "NSObject", "objc2-core-foundation"] }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
trash = "5"
uuid = { version = "1", features = ["v4"] }

# panic = "abort" is deliberately NOT set: with abort, a panic on any worker
# thread (PTY readers, watchers) would kill the whole app instantly.
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
